<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Platzhalter für das Hero-Bild">
  <!-- Platzhalter  später durch echtes Bild ersetzen (Seitenverhältnis 4:5) -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF0F7"/>
      <stop offset="0.55" stop-color="#E7F4EE"/>
      <stop offset="1" stop-color="#D6E7DE"/>
    </linearGradient>
    <clipPath id="hc"><rect width="800" height="1000"/></clipPath>
  </defs>
  <rect width="800" height="1000" fill="url(#hg)"/>
  <!-- Globus-Bahnen als dezentes Ornament (Motiv aus dem Logo) -->
  <g clip-path="url(#hc)" fill="none" stroke-linecap="round">
    <g stroke="#002858" stroke-opacity="0.10" stroke-width="26">
      <path d="M-60 300 C 180 190, 560 210, 880 330"/>
      <path d="M-60 520 C 200 400, 600 420, 880 550"/>
      <path d="M-60 740 C 200 620, 600 640, 880 770"/>
    </g>
    <g stroke="#18A870" stroke-opacity="0.16" stroke-width="26">
      <path d="M-60 410 C 200 295, 600 315, 880 440"/>
      <path d="M-60 630 C 200 510, 600 530, 880 660"/>
      <path d="M-60 850 C 200 730, 600 750, 880 880"/>
    </g>
    <circle cx="400" cy="500" r="330" stroke="#002858" stroke-opacity="0.08" stroke-width="2"/>
  </g>
  <g transform="translate(400 452)">
    <rect x="-46" y="-40" width="92" height="74" rx="10" fill="none" stroke="#002858" stroke-opacity="0.42" stroke-width="4"/>
    <circle cx="-18" cy="-16" r="9" fill="#18A870" fill-opacity="0.7"/>
    <path d="M-42 26 L -8 -8 L 12 12 L 26 0 L 42 18 L 42 30 Z" fill="#002858" fill-opacity="0.35"/>
  </g>
  <text x="400" y="560" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#002858" fill-opacity="0.65">Platzhalter</text>
  <text x="400" y="602" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="22" fill="#5B6B7B">Hero-Bild · 4:5</text>
</svg>
