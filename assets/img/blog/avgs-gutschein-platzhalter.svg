<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Platzhalter: Titelbild zum Beitrag über den AVGS-Gutschein">
  <!-- Platzhalter  später durch echtes Titelbild ersetzen (Seitenverhältnis 16:9) -->
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF0F7"/>
      <stop offset="1" stop-color="#E7F4EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#c1)"/>
  <g fill="none" stroke-linecap="round">
    <g stroke="#002858" stroke-opacity="0.09" stroke-width="24">
      <path d="M-60 180 C 280 80, 900 90, 1260 210"/>
      <path d="M-60 500 C 280 400, 900 410, 1260 530"/>
    </g>
    <g stroke="#18A870" stroke-opacity="0.15" stroke-width="24">
      <path d="M-60 340 C 280 240, 900 250, 1260 370"/>
