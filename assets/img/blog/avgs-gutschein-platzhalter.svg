  </g>
  <!-- stilisierter Gutschein -->
  <g transform="translate(600 300)">
    <rect x="-170" y="-100" width="340" height="200" rx="18" fill="#FFFFFF" fill-opacity="0.85" stroke="#002858" stroke-opacity="0.32" stroke-width="4"/>
    <path d="M-170 -20 h340 M-170 20 h340" stroke="#002858" stroke-opacity="0.14" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="0" y="-42" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="46" font-weight="700" fill="#0E6B48">AVGS</text>
    <text x="0" y="66" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="22" fill="#5B6B7B">§ 45 SGB III</text>
  </g>
  <text x="600" y="500" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#002858" fill-opacity="0.6">Platzhalter</text>
  <text x="600" y="536" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#5B6B7B">Titelbild Blogbeitrag · 16:9</text>
</svg>
